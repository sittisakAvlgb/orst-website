<div class="page-header">
  <div class="container">
    [[breadcrumb]]
    <div class="page-header__body">
      <p class="eyebrow">[[nav-page:section]]</p>
      <h1>[[nav-page:title]]</h1>
    </div>
  </div>
</div>

<div class="section">
  <div class="container with-sidebar with-sidebar--nav">
    <div>
      [[nav-page:body]]
    </div>
    <nav class="with-sidebar__aside section-nav" aria-labelledby="section-nav-title">
      <p class="toc__title" id="section-nav-title">[[t:navPage.inSection]]</p>
      [[nav-page:tree]]
    </nav>
  </div>
</div>
